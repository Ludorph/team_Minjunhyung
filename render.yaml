# Render Blueprint — 저장소의 Dockerfile로 공개 데모 서버 1개를 만든다.
# main 브랜치에 push하면 자동으로 다시 배포된다.
services:
  - type: web
    name: feedbackcare
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: FEEDBACKCARE_DEMO_DATA
        value: "1"
      # 생성형 AI 연동 후 Render 대시보드에서 직접 입력 (저장소에 키를 넣지 않는다)
      - key: FEEDBACKCARE_AI_API_KEY
        sync: false
